<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Staff Portal</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 13px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .detail-item label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        
        .detail-item div {
            font-weight: 500;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin:4px 0 0; font-size:13px; color:var(--muted);">Staff Portal</p>
        </div>
        <div style="padding: 12px 24px; font-weight: 600; color: var(--primary); background: #f5f3ff; border-right: 3px solid var(--primary);">
            Customer Directory
        </div>
    </aside>

    <div class="main">
        <div class="header">
            <h1 style="margin:0; font-size: 20px;">Customer Directory</h1>
            <button class="btn btn-outline" onclick="window.location.href='../../public/login.html'">Logout</button>
        </div>
        
        <div class="content">
            <div class="card">
                <h3 style="margin:0 0 20px 0;">All Customers</h3>
                <div id="tableContainer">Loading customers...</div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-backdrop" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 style="margin:0;">Customer Details</h2>
                <button class="btn btn-outline" onclick="closeModal()">Close</button>
            </div>
            
            <h3 style="margin-top:0;">Profile Information</h3>
            <div class="detail-grid" id="profileDetails">
                <!-- Injected via JS -->
            </div>

            <hr style="border:0; border-top:1px solid var(--border); margin:24px 0;">
            
            <h3 style="margin-top:0;">Registered Vehicles</h3>
            <table style="margin-bottom: 24px;">
                <thead>
                    <tr><th>Number</th><th>Brand</th><th>Model</th><th>Type</th></tr>
                </thead>
                <tbody id="vehicleList">
                    <!-- Injected via JS -->
                </tbody>
            </table>

            <h3 style="margin-top:0;">Service History</h3>
            <div style="padding: 16px; background: var(--bg); border-radius: 8px; color: var(--muted); text-align: center;">
                No service history available for this customer.
            </div>
        </div>
    </div>

    <script>
        const apiBaseUrl = 'http://localhost:5178/api';
        let allCustomers = [];

        window.onload = async () => {
            // For feature 8: simply load customers (assuming staff is logged in, no strict token check for milestone here as requested to use existing auth pattern)
            try {
                const res = await fetch(`${apiBaseUrl}/customers`);
                allCustomers = await res.json();
                renderTable();
            } catch (err) {
                document.getElementById('tableContainer').innerHTML = '<p style="color:red;">Error loading customers.</p>';
            }
        };

        function renderTable() {
            if(allCustomers.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<p>No customers found.</p>';
                return;
            }
            
            const rows = allCustomers.map(c => `
                <tr>
                    <td style="font-weight:600;">${c.fullName}</td>
                    <td>${c.email}</td>
                    <td>${c.phone || 'N/A'}</td>
                    <td>
                        <button class="btn" onclick="viewDetails(${c.customerId})">View Details & Vehicles</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('tableContainer').innerHTML = `
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function viewDetails(customerId) {
            const customer = allCustomers.find(c => c.customerId === customerId);
            if(!customer) return;

            document.getElementById('profileDetails').innerHTML = `
                <div class="detail-item"><label>Full Name</label><div>${customer.fullName}</div></div>
                <div class="detail-item"><label>Email</label><div>${customer.email}</div></div>
                <div class="detail-item"><label>Phone</label><div>${customer.phone || 'Not provided'}</div></div>
                <div class="detail-item"><label>Address</label><div>${customer.address || 'Not provided'}</div></div>
                <div class="detail-item"><label>Joined Date</label><div>${new Date(customer.createdAt).toLocaleDateString()}</div></div>
            `;

            document.getElementById('vehicleList').innerHTML = '<tr><td colspan="4" style="text-align:center;">Loading vehicles...</td></tr>';
            document.getElementById('detailsModal').style.display = 'flex';

            try {
                // We use the customer's UserID to fetch vehicles (as per API design `/{userId}/vehicles`)
                const res = await fetch(`${apiBaseUrl}/customers/${customer.userId}/vehicles`);
                const vehicles = await res.json();
                
                if(vehicles.length === 0) {
                    document.getElementById('vehicleList').innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--muted);">No vehicles registered.</td></tr>';
                } else {
                    document.getElementById('vehicleList').innerHTML = vehicles.map(v => `
                        <tr>
                            <td style="font-weight:600;">${v.vehicleNumber}</td>
                            <td>${v.brand}</td>
                            <td>${v.model}</td>
                            <td>${v.vehicleType}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                document.getElementById('vehicleList').innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Failed to load vehicles.</td></tr>';
            }
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }
    </script>
</body>
</html>

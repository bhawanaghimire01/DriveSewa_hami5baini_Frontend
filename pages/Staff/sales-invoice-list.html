<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

        /* Sidebar Styles */
        .sidebar { background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; gap: 0;}
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }
        .nav-title { flex: 1; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; border-bottom: none;}
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 32px 40px; flex: 1; display: flex; flex-direction: column; }

        .table-card { background: var(--surface); border: none; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-soft); flex: 1; padding: 10px; }
        .table-header { padding: 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .table-header h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--secondary); }
        
        .btn-primary { background: var(--primary); color: #fff; border: none; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary:hover { background: var(--primary-dark); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 22px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: var(--surface-soft); color: var(--muted); font-size: 12px; text-transform: uppercase; }
        tr:last-child td { border-bottom: 0; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn-view { color: var(--primary); background: #eaf2ff; border: 1px solid #b8d2ff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; }
        .btn-view:hover { text-decoration: underline; }

        .message { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; display: none; }
        .message.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
        .message.success { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
    </style>
</head>
<body>

        <main class="main">
            <header class="topbar">
                <h1 class="page-title">Sales Invoices</h1>
                <div class="top-actions">
                    <span class="welcome" id="welcomeText">Staff</span>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </header>

            <section class="content">
                <div id="alertMsg" class="message"></div>
                <div class="table-card">
                    <div class="table-header">
                        <h2>Sales History</h2>
                        <a href="create-sales-invoice.html" class="btn-primary">+ Create Sales Invoice</a>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Invoice #ID</th>
                                <th>Customer Name</th>
                                <th>Date</th>
                                <th>Total ($)</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody">
                            <tr><td colspan="6" style="text-align: center; color: var(--muted);">Loading invoices...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        const apiBaseUrl = 'http://localhost:5178/api/sales-invoices';
        let authToken = '';

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "../../public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Staff") { window.location.href = "../../public/login.html"; return; }
            
            document.getElementById("welcomeText").textContent = "Welcome, " + (user.fullName || "Staff");
            authToken = user.token || ''; 
            
            loadInvoices();
        };

        function logout() {
            localStorage.removeItem("driveSewaUser");
            window.location.href = "../../public/login.html";
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            };
        }

        function showMessage(msg, type) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.textContent = msg;
            alertMsg.className = 'message ' + type;
            alertMsg.style.display = 'block';
            setTimeout(() => { alertMsg.style.display = 'none'; }, 4000);
        }

        async function loadInvoices() {
            try {
                const res = await fetch(apiBaseUrl, { headers: getAuthHeaders() });
                if (!res.ok) throw new Error('Failed to load invoices');
                const invoices = await res.json();
                renderTable(invoices);
            } catch (error) {
                document.getElementById('invoiceTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Error loading invoices. Is the backend running?</td></tr>`;
            }
        }

        function renderTable(invoices) {
            const tbody = document.getElementById('invoiceTableBody');
            if(invoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No sales invoices found. Create a new one.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = invoices.map(inv => {
                const dateObj = new Date(inv.saleDate);
                const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();
                return `
                <tr>
                    <td><strong>#SAL-${inv.invoiceId.toString().padStart(4, '0')}</strong></td>
                    <td>${inv.customerName}</td>
                    <td>${formattedDate}</td>
                    <td style="color:var(--primary); font-weight:bold;">$${inv.finalAmount.toFixed(2)}</td>
                    <td><span style="color:var(--success); background:#ecfdf3; padding: 4px 8px; border-radius: 4px; font-size:12px;">${inv.paymentStatus}</span></td>
                    <td class="action-btns">
                        <a href="sales-invoice-details.html?id=${inv.invoiceId}" class="btn-view">View Details</a>
                    </td>
                </tr>
            `}).join('');
        }
    </script>

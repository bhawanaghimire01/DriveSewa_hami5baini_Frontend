<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory - Staff Portal</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            background: #f5f3ff;
            border-left-color: var(--primary);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg);
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin:4px 0 0; font-size:13px; color:var(--muted);">Staff Portal</p>
        </div>
        <div class="nav-item active">
            Customer Directory
        </div>
    </aside>

    <div class="main">
        <div class="header">
            <h1 style="margin:0; font-size: 20px;">Customer Directory</h1>
            <button class="btn" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);" onclick="logout()">Logout</button>
        </div>
        
        <div class="content">
            <div class="card">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search by Name, Phone, ID, or Vehicle Number..." onkeypress="handleEnter(event)">
                    <button class="btn" onclick="searchCustomers()">Search</button>
                </div>

                <div id="tableContainer">Loading customers...</div>
            </div>
        </div>
    </div>

    <script>
        const apiBaseUrl = 'http://localhost:5178/api';

        // Authentication Guard
        window.onload = () => {
            const stored = localStorage.getItem('driveSewaUser');
            if(!stored) {
                window.location.href = '../../public/login.html';
                return;
            }
            const user = JSON.parse(stored);
            if(user.role !== 'Admin' && user.role !== 'Staff') {
                window.location.href = '../../public/login.html';
                return;
            }
            loadCustomers();
        };

        function logout() {
            localStorage.removeItem('driveSewaUser');
            window.location.href = '../../public/login.html';
        }

        function handleEnter(e) {
            if(e.key === 'Enter') searchCustomers();
        }

        async function searchCustomers() {
            const query = document.getElementById('searchInput').value.trim();
            loadCustomers(query);
        }

        async function loadCustomers(query = '') {
            document.getElementById('tableContainer').innerHTML = '<p>Loading customers...</p>';
            try {
                let url = `${apiBaseUrl}/customers`;
                if (query) url += `?search=${encodeURIComponent(query)}`;
                
                const res = await fetch(url);
                const customers = await res.json();
                renderTable(customers);
            } catch (err) {
                document.getElementById('tableContainer').innerHTML = '<p style="color:red;">Error loading customers.</p>';
            }
        }

        function renderTable(customers) {
            if(customers.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<p style="text-align:center; padding: 20px; color:var(--muted);">No customers found.</p>';
                return;
            }
            
            const rows = customers.map(c => `
                <tr>
                    <td>#${c.customerId}</td>
                    <td style="font-weight:600;">${c.fullName}</td>
                    <td>${c.phone || 'N/A'}</td>
                    <td>${c.email}</td>
                    <td><span class="badge">Active</span></td>
                    <td>
                        <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="window.location.href='customer-details.html?id=${c.customerId}'">View Details</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('tableContainer').innerHTML = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }
    </script>
</body>
</html>

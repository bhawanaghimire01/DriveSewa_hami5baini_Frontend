<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Directory - Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

        /* Sidebar Styles */
        .sidebar { background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; gap: 0;}
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }
        .nav-title { flex: 1; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; border-bottom: none;}
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 32px 40px; flex: 1; display: flex; flex-direction: column; }

        .card { background: var(--surface); border: none; border-radius: 20px; padding: 32px; box-shadow: var(--shadow-soft); flex: 1; display: flex; flex-direction: column;}
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 20px; flex-wrap: wrap;}
        
        .search-container { position: relative; flex: 1; min-width: 300px; max-width: 500px;}
        .search-container svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box { padding: 14px 20px 14px 48px; border: 1px solid var(--border); border-radius: 12px; width: 100%; font-size: 15px; font-family: inherit; color: var(--secondary); background: #fafafa; transition: var(--transition);}
        .search-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); background: var(--surface);}
        
        .btn-new { background: linear-gradient(135deg, var(--primary), #868CFF); color: white; padding: 14px 24px; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(67,24,255,0.2); transition: var(--transition);}
        .btn-new:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(67,24,255,0.3); }
        
        .table-container { flex: 1; overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { font-weight: 600; color: var(--primary); background: rgba(67, 24, 255, 0.03); text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 1; }
        th:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        th:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        tr:hover td { background: rgba(67, 24, 255, 0.01); }
        td { color: var(--text); }
        
        .badge { display: inline-block; padding: 6px 12px; background: #eaf2ff; color: var(--primary); border-radius: 8px; font-size: 13px; font-weight: 600; margin: 2px; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #A3AED0, #E0E5F2); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; margin-right: 12px; }
        .customer-info { display: flex; align-items: center; }
        .customer-meta { display: flex; flex-direction: column; }
        .customer-name { font-weight: 700; color: var(--secondary); font-size: 15px;}
        .customer-id { font-size: 12px; color: var(--text-muted); }

        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .page-info { color: var(--text-muted); font-size: 14px; font-weight: 500;}
        .page-controls { display: flex; gap: 8px; }
        .btn-page { background: var(--surface); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-weight: 600; color: var(--text); cursor: pointer; transition: var(--transition); }
        .btn-page:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state svg { width: 80px; height: 80px; color: var(--border); margin-bottom: 16px; }
        .empty-state h3 { color: var(--secondary); font-size: 20px; margin: 0 0 8px 0;}
        .empty-state p { color: var(--text-muted); margin: 0;}
    </style>
</head>
<body>

            <div class="brand">
                <div class="brand-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
                </div>
                <div>
                    <div class="brand-title">DriveSewa</div>

            </div>
            <nav class="side-nav">
                <a class="nav-link" href="staff-dashboard.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>

                <a class="nav-link active" href="customer-list.html">

                    <span class="nav-title">Customers</span>
                </a>
                <a class="nav-link" href="staff-vehicles.html">

                <a class="nav-link" href="staff-customer-history.html">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span class="nav-title">Appointments</span>

                <a class="nav-link" href="staff-part-requests.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span class="nav-title">Part Requests</span>
                </a>

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>

        <main class="main">
            <header class="topbar">
                <h1 class="page-title">Customer Directory</h1>
                <div class="top-actions">
                    <span class="welcome" id="welcomeText">Staff</span>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </header>

            <section class="content">
                <div class="card">
                    <div class="toolbar">
                        <div class="search-container">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="searchInput" class="search-box" placeholder="Search by name, phone, email, or vehicle..." autocomplete="off">
                        </div>
                        <a href="register-customer.html" class="btn-new">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                            New Customer
                        </a>
                    </div>
                    
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Customer Profile</th>
                                    <th>Contact Information</th>
                                    <th>Registered Vehicles</th>
                                    <th>Joined Date</th>
                                    <th style="text-align:center;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="customerTableBody">
                                <tr><td colspan="5" style="text-align:center; padding: 60px;">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <div class="page-info" id="pageInfo">Showing 0 of 0 customers</div>
                        <div class="page-controls">
                            <button class="btn-page" id="btnPrev" onclick="prevPage()" disabled>Previous</button>
                            <button class="btn-page" id="btnNext" onclick="nextPage()" disabled>Next</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <script>
        const API_BASE_URL = 'http://localhost:5178/api';
        let authToken = '';
        let allCustomers = [];
        let filteredCustomers = [];
        let currentPage = 1;
        const pageSize = 8;
        let searchTimeout = null;

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "../../public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Staff") { window.location.href = "../../public/login.html"; return; }
            
            authToken = user.token;
            document.getElementById("welcomeText").textContent = user.fullName || "Staff";
            
            loadCustomers();
        };

        function logout() {
            localStorage.removeItem("driveSewaUser");
            window.location.href = "../../public/login.html";
        }

        async function loadCustomers(search = '') {
            try {
                let url = `${API_BASE_URL}/customers`;
                if(search) url += `?search=${encodeURIComponent(search)}`;
                
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (res.ok) {
                    allCustomers = await res.json();
                    
                    // Client-side fallback filtering in case backend doesn't support the full text query nicely
                    if(search) {
                        const s = search.toLowerCase();
                        filteredCustomers = allCustomers.filter(c => 
                            c.fullName.toLowerCase().includes(s) || 
                            c.email.toLowerCase().includes(s) ||
                            (c.phone && c.phone.includes(s)) ||
                            (c.vehicleNumbers && c.vehicleNumbers.some(v => v.toLowerCase().includes(s)))
                        );
                    } else {
                        filteredCustomers = [...allCustomers];
                    }
                    
                    currentPage = 1;
                    renderTable();
                } else {
                    showError();
                }
            } catch (err) {
                console.error('Error fetching customers:', err);
                showError();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('customerTableBody');
            
            if (filteredCustomers.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <h3>No Customers Found</h3>
                            <p>Try adjusting your search criteria or register a new customer.</p>
                        </div>
                    </td></tr>
                `;
                updatePagination();
                return;
            }

            const startIdx = (currentPage - 1) * pageSize;
            const paginated = filteredCustomers.slice(startIdx, startIdx + pageSize);

            tbody.innerHTML = paginated.map(c => {
                const vehicles = c.vehicleNumbers && c.vehicleNumbers.length > 0 
                    ? c.vehicleNumbers.map(v => `<span class="badge">${v}</span>`).join('') 
                    : '<span style="color:var(--text-muted); font-size:13px; font-style:italic;">No vehicles registered</span>';
                    
                const date = new Date(c.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                const initial = c.fullName ? c.fullName.charAt(0).toUpperCase() : '?';

                return `
                    <tr>
                        <td>
                            <div class="customer-info">
                                <div class="avatar-circle">${initial}</div>
                                <div class="customer-meta">
                                    <span class="customer-name">${c.fullName}</span>
                                    <span class="customer-id">ID: #${c.customerId}</span>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div style="font-size:14px; color:var(--text); font-weight:500;">${c.email}</div>
                            <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">${c.phone || 'Phone N/A'}</div>
                        </td>
                        <td>${vehicles}</td>
                        <td><span style="color:var(--text); font-weight:500;">${date}</span></td>
                        <td style="text-align:center;">
                            <a href="staff-customer-history.html?customerId=${c.customerId}" style="background:var(--primary-light); color:var(--primary); text-decoration:none; padding:8px 16px; border-radius:8px; font-weight:600; font-size:13px; transition:var(--transition); display:inline-block;" onmouseover="this.style.background='var(--primary)'; this.style.color='white';" onmouseout="this.style.background='var(--primary-light)'; this.style.color='var(--primary)';">View History</a>
                        </td>
                    </tr>
                `;
            }).join('');
            
            updatePagination();
        }

        function updatePagination() {
            const total = filteredCustomers.length;
            const startIdx = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const endIdx = Math.min(currentPage * pageSize, total);
            
            document.getElementById('pageInfo').textContent = `Showing ${startIdx} to ${endIdx} of ${total} customers`;
            
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = endIdx >= total;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            if ((currentPage * pageSize) < filteredCustomers.length) {
                currentPage++;
                renderTable();
            }
        }

        function showError() {
            document.getElementById('customerTableBody').innerHTML = `
                <tr><td colspan="5">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h3 style="color:var(--danger);">Error Loading Data</h3>
                        <p>Could not connect to the server. Please try again later.</p>
                    </div>
                </td></tr>
            `;
            document.getElementById('pageInfo').textContent = 'Error';
            document.getElementById('btnPrev').disabled = true;
            document.getElementById('btnNext').disabled = true;
        }

        // Live Search with Debounce
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value;
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadCustomers(query);
            }, 300); // 300ms debounce
        });
    </script>
</body>
</html>

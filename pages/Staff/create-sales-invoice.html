<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sales Invoice - Staff Portal</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            background: #f5f3ff;
            border-left-color: var(--primary);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-control {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--surface);
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 14px;
        }

        .btn-secondary { background: var(--muted); }
        .btn-danger { background: var(--danger); }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--bg);
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        .summary {
            max-width: 420px;
            margin-left: auto;
            display: grid;
            gap: 10px;
            font-size: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .summary-row.final {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            border-bottom: none;
        }

        .discount-message {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            background: #f3f4f6;
            color: var(--muted);
        }

        .discount-message.applied {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin:4px 0 0; font-size:13px; color:var(--muted);">Staff Portal</p>
        </div>
        <div class="nav-item" onclick="window.location.href='customer-list.html'">
            Customer Directory
        </div>
        <div class="nav-item active">
            Create Sales Invoice
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <h1 style="margin:0; font-size: 20px;">Create Sales Invoice</h1>
            <button class="btn btn-secondary" type="button" onclick="logout()">Logout</button>
        </header>

        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h3>Invoice Details</h3>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Customer</label>
                        <select id="customerId" class="form-control" required>
                            <option value="">Loading customers...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Part</label>
                        <select id="partId" class="form-control">
                            <option value="">Loading parts...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="quantity" class="form-control" min="1" value="1">
                    </div>
                    <div class="form-group" style="justify-content: end;">
                        <button type="button" class="btn" onclick="addItem()">Add Item</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Items</h3>
                </div>
                <div id="itemsContainer">
                    <p style="color: var(--muted);">No items added.</p>
                </div>
            </div>

            <div class="card">
                <div class="summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong id="subTotal">Rs. 0.00</strong>
                    </div>
                    <div id="discountMessage" class="discount-message">No loyalty discount applied</div>
                    <div class="summary-row">
                        <span>Loyalty Discount</span>
                        <strong id="discountAmount">Rs. 0.00</strong>
                    </div>
                    <div class="summary-row final">
                        <span>Final Payable</span>
                        <span id="finalTotal">Rs. 0.00</span>
                    </div>
                    <button type="button" class="btn" onclick="submitInvoice()">Create Invoice</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/Js/sales-invoice.js"></script>
</body>
</html>

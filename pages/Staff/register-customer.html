<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer - Staff Portal</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
            cursor: pointer;
        }
        
        .nav-item:hover {
            color: var(--primary);
            background: #f5f3ff;
        }

        .nav-item.active {
            color: var(--primary);
            background: #f5f3ff;
            border-left-color: var(--primary);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            max-width: 800px;
        }

        .card-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .card-header h3 { margin: 0; color: var(--primary); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
        }

        input, select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-size: 14px;
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .message.success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #86efac;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin:4px 0 0; font-size:13px; color:var(--muted);">Staff Portal</p>
        </div>
        <div class="nav-item" onclick="window.location.href='customer-list.html'">
            Customer Directory
        </div>
        <div class="nav-item active">
            Register New Customer
        </div>
    </aside>

    <div class="main">
        <div class="header">
            <h1 style="margin:0; font-size: 20px;">Register Customer & Vehicle</h1>
            <button class="btn" style="width: auto; background: transparent; border: 1px solid var(--primary); color: var(--primary);" onclick="logout()">Logout</button>
        </div>
        
        <div class="content">
            <div id="alertMsg" class="message"></div>

            <form id="registrationForm">
                <div class="card">
                    <div class="card-header">
                        <h3>1. Customer Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="cName" required placeholder="Jane Doe">
                        </div>
                        <div class="form-group">
                            <label>Email Address *</label>
                            <input type="email" id="cEmail" required placeholder="jane@example.com">
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="cPhone" required placeholder="+977 9800000000">
                        </div>
                        <div class="form-group">
                            <label>Address *</label>
                            <input type="text" id="cAddress" required placeholder="Kathmandu, Nepal">
                        </div>
                        <div class="form-group full">
                            <label>Default Password</label>
                            <input type="text" id="cPassword" placeholder="Default123!">
                            <small style="color:var(--muted); font-size: 12px; margin-top:4px;">Leave blank to use 'Default123!'</small>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3>2. Primary Vehicle Details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Vehicle Number *</label>
                            <input type="text" id="vNumber" required placeholder="BA 1 PA 1234">
                        </div>
                        <div class="form-group">
                            <label>Vehicle Type *</label>
                            <select id="vType" required>
                                <option value="Car">Car</option>
                                <option value="Motorcycle">Motorcycle</option>
                                <option value="SUV">SUV</option>
                                <option value="Truck">Truck</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Brand (Make) *</label>
                            <input type="text" id="vBrand" required placeholder="Toyota, Honda, etc.">
                        </div>
                        <div class="form-group">
                            <label>Model *</label>
                            <input type="text" id="vModel" required placeholder="Corolla, Civic, etc.">
                        </div>
                    </div>
                </div>

                <div style="max-width: 800px;">
                    <button type="submit" id="submitBtn" class="btn">Register Customer & Vehicle</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const apiBaseUrl = 'http://localhost:5178/api';

        // Security check
        window.onload = () => {
            const stored = localStorage.getItem('driveSewaUser');
            if(!stored) { window.location.href = '../../public/login.html'; return; }
            const user = JSON.parse(stored);
            if(user.role !== 'Admin' && user.role !== 'Staff') {
                window.location.href = '../../public/login.html'; return;
            }
        };

        function logout() {
            localStorage.removeItem('driveSewaUser');
            window.location.href = '../../public/login.html';
        }

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertMsg = document.getElementById('alertMsg');
            
            btn.textContent = 'Registering...';
            btn.disabled = true;
            alertMsg.style.display = 'none';

            const payload = {
                fullName: document.getElementById('cName').value.trim(),
                email: document.getElementById('cEmail').value.trim(),
                phone: document.getElementById('cPhone').value.trim(),
                address: document.getElementById('cAddress').value.trim(),
                password: document.getElementById('cPassword').value,
                vehicleNumber: document.getElementById('vNumber').value.trim(),
                vehicleType: document.getElementById('vType').value,
                brand: document.getElementById('vBrand').value.trim(),
                model: document.getElementById('vModel').value.trim()
            };

            try {
                const response = await fetch(`${apiBaseUrl}/customers/register-with-vehicle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    alertMsg.textContent = 'Registration successful! Redirecting to customer details...';
                    alertMsg.className = 'message success';
                    alertMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = `customer-details.html?id=${data.customerId}`;
                    }, 1500);
                } else {
                    const errorText = await response.text();
                    alertMsg.textContent = errorText || 'Registration failed. Check if email or vehicle number already exists.';
                    alertMsg.className = 'message error';
                    alertMsg.style.display = 'block';
                    btn.textContent = 'Register Customer & Vehicle';
                    btn.disabled = false;
                }
            } catch (err) {
                alertMsg.textContent = 'Network error. Ensure backend is running.';
                alertMsg.className = 'message error';
                alertMsg.style.display = 'block';
                btn.textContent = 'Register Customer & Vehicle';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

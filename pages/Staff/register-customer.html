<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

        /* Sidebar Styles */
        .sidebar { background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; gap: 0;}
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }
        .nav-title { flex: 1; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; border-bottom: none;}
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; margin: 0;}
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 32px 40px; flex: 1; }

        .card { background: var(--surface); border-radius: 20px; padding: 32px; box-shadow: var(--shadow-soft); max-width: 800px; }
        .card h3 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; color: var(--secondary); font-size: 20px; font-weight: 700;}
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }
        
        label { font-weight: 600; font-size: 14px; color: var(--text); }
        input, select { padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; color: var(--secondary); background: var(--bg); transition: var(--transition);}
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); background: var(--surface);}
        
        .btn-submit { background: var(--primary); color: #fff; padding: 14px 24px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: var(--transition); width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.2);}
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67, 24, 255, 0.3); }
    </style>
</head>

                </div>

        <main class="main">
            <header class="topbar">
                <h1 class="page-title">Register Customer & Vehicle</h1>
                <div class="top-actions">
                    <span class="welcome" id="welcomeText">Staff</span>
                    <button class="logout-btn" onclick="logout()">Log Out</button>
                </div>
            </header>

            <section class="content">
                <div class="card">
                    <h3>Customer Information</h3>
                    <form id="registerForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="fullName" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="email" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="phone" required>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" id="address" required>
                            </div>
                            <div class="form-group full">
                                <label>Temporary Password</label>
                                <input type="text" id="password" value="DriveSewa123!" required>
                                <small style="color: var(--muted); font-size: 12px; margin-top: 4px;">Share this password with the customer so they can log in.</small>
                            </div>
                            
                            <div class="form-group full" style="margin-top: 20px;">
                                <h3>Vehicle Information</h3>
                            </div>

                            <div class="form-group">
                                <label>Vehicle Number</label>
                                <input type="text" id="vehicleNumber" required>
                            </div>
                            <div class="form-group">
                                <label>Brand</label>
                                <input type="text" id="brand" required>
                            </div>
                            <div class="form-group">
                                <label>Model</label>
                                <input type="text" id="model" required>
                            </div>
                            <div class="form-group">
                                <label>Vehicle Type</label>
                                <select id="vehicleType" required>
                                    <option value="Car">Car</option>
                                    <option value="Motorcycle">Motorcycle</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Truck">Truck</option>
                                </select>
                            </div>

                            <div class="form-group full">
                                <button type="submit" class="btn-submit" id="submitBtn">Register Customer</button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5178/api';
        let authToken = '';

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "../../public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Staff") { window.location.href = "../../public/login.html"; return; }
            
            authToken = user.token;
            document.getElementById("welcomeText").textContent = user.fullName || "Staff";
        };

        function logout() {
            localStorage.removeItem("driveSewaUser");
            window.location.href = "../../public/login.html";
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Registering...';
            btn.disabled = true;

            const payload = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                password: document.getElementById('password').value,
                vehicleNumber: document.getElementById('vehicleNumber').value,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                vehicleType: document.getElementById('vehicleType').value
            };

            try {
                const res = await fetch(`${API_BASE_URL}/customers/register-with-vehicle`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Customer and Vehicle registered successfully!');
                    document.getElementById('registerForm').reset();
                    document.getElementById('password').value = "DriveSewa123!";
                } else {
                    const data = await res.json();
                    alert(data.message || data || 'Registration failed');
                }
            } catch (err) {
                alert('Network error during registration.');
            } finally {
                btn.textContent = 'Register Customer';
                btn.disabled = false;
            }
        });
    </script>

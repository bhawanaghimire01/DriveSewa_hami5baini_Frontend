<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - DriveSewa</title>
    <script>
        (function() {
            const stored = localStorage.getItem('driveSewaCustomer') || localStorage.getItem('driveSewaUser');
            if (!stored) {
                window.location.href = '../../public/login.html';
                return;
            }
            try {
                const user = JSON.parse(stored);
                if (!user || !user.role || user.role.toLowerCase() !== 'customer') {
                    localStorage.removeItem('driveSewaUser');
                    localStorage.removeItem('driveSewaCustomer');
                    window.location.href = '../../public/login.html';
                }
            } catch (e) {
                localStorage.removeItem('driveSewaUser');
                localStorage.removeItem('driveSewaCustomer');
                window.location.href = '../../public/login.html';
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4318FF;
            --primary-light: #868CFF;
            --secondary: #11047A;
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 24px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
        
        .nav-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-item:hover { background: rgba(67, 24, 255, 0.05); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2); }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { height: 80px; background: transparent; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; margin-top: 10px; }
        .header-title { font-size: 32px; font-weight: 800; color: var(--secondary); margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 8px 16px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #FFCE20, #EE5D50); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .user-name { font-weight: 700; font-size: 14px; color: var(--secondary); }
        
        .logout-btn { padding: 10px 20px; background: #FFECEB; color: var(--danger); border: none; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); font-family: inherit; }
        .logout-btn:hover { background: var(--danger); color: white; box-shadow: 0 10px 20px rgba(238, 93, 80, 0.2); }

        .content-area { flex: 1; padding: 20px 40px 40px; overflow-y: auto; }
        
        /* Banner */
        .welcome-banner { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); border-radius: 24px; padding: 40px; color: white; position: relative; overflow: hidden; box-shadow: var(--shadow-hover); margin-bottom: 40px; }
        .welcome-banner::after { content: ''; position: absolute; right: -5%; top: -20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; pointer-events: none; }
        .welcome-banner h2 { font-size: 36px; margin-bottom: 12px; font-weight: 800; letter-spacing: -1px; }
        .welcome-banner p { font-size: 16px; opacity: 0.9; max-width: 500px; line-height: 1.6; font-weight: 400; }
        
        /* Grid Layout */
        .modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        
        .module-card { background: var(--surface); border-radius: 24px; padding: 32px; box-shadow: var(--shadow-soft); border: 1px solid transparent; transition: var(--transition); display: flex; flex-direction: column; position: relative; overflow: hidden; text-decoration: none; }
        .module-card:hover { transform: translateY(-8px); border-color: rgba(67, 24, 255, 0.1); box-shadow: var(--shadow-hover); }
        
        .module-icon-wrapper { width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; transition: var(--transition); }
        .module-card:hover .module-icon-wrapper { transform: scale(1.1); }
        
        .c-blue { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        .c-orange { background: rgba(255, 206, 32, 0.15); color: #E5B200; }
        .c-green { background: rgba(1, 181, 116, 0.1); color: var(--success); }
        .c-purple { background: rgba(134, 140, 255, 0.15); color: var(--primary-light); }
        
        .module-card h3 { font-size: 22px; font-weight: 800; color: var(--secondary); margin-bottom: 12px; }
        .module-card p { font-size: 15px; color: var(--text-muted); line-height: 1.6; font-weight: 500; margin-bottom: 24px; flex-grow: 1; }
        
        .module-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; transition: var(--transition); border: none; background: transparent; padding: 0; cursor: pointer; }
        .c-blue .module-btn { color: var(--primary); }
        .c-orange .module-btn { color: #E5B200; }
        .c-green .module-btn { color: var(--success); }
        .c-purple .module-btn { color: var(--primary-light); }
        
        .module-card:hover .module-btn { gap: 14px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
            .header { padding: 20px; height: auto; flex-direction: column; gap: 20px; margin-top: 0; }
            .content-area { padding: 20px; }
            .welcome-banner h2 { font-size: 28px; }
        }
            /* Added Premium UI Forms and Tables */
        .card { background: var(--surface); border: none; border-radius: 20px; padding: 32px; box-shadow: var(--shadow-soft); margin-bottom: 24px; }
        .card-title { margin-top: 0; margin-bottom: 24px; font-size: 22px; font-weight: 700; color: var(--secondary); display: flex; justify-content: space-between; align-items: center;}
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 14px; font-weight: 600; color: var(--secondary); }
        .form-control { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; background: var(--bg); transition: var(--transition); color: var(--text); }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); background: var(--surface); }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: var(--transition); display: inline-block; text-align: center; text-decoration: none; font-family: inherit;}
        .btn-primary:hover { background: var(--secondary); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .btn-danger { background: #FFECEB; color: var(--danger); border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .btn-danger:hover { background: var(--danger); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: rgba(244, 247, 254, 0.5); color: var(--text-muted); font-size: 13px; text-transform: uppercase; font-weight: 600; border-bottom: 2px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(244, 247, 254, 0.3); }
        
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
        .status-pending { background: rgba(255, 206, 32, 0.15); color: #E5B200; }
        .status-approved { background: rgba(1, 181, 116, 0.15); color: var(--success); }
        .status-completed { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        .status-rejected { background: #FFECEB; color: var(--danger); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    <path d="M2 12h20"></path>
                </svg>
            </div>
            <div>
                <div class="brand-title">DriveSewa</div>
                <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;">Customer Portal</div>
            </div>
        </div>
        
        <nav>
            <a class="nav-item" href="customer-dashboard.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                Dashboard
            </a>
            <a class="nav-item" href="customer-profile.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                My Profile
            </a>
            <a class="nav-item" href="customer-vehicles.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                My Vehicles
            </a>
            <a class="nav-item active" href="customer-appointments.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Appointments
            </a>
            <a class="nav-item" href="customer-part-requests.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                Part Requests
            </a>
            <a class="nav-item" href="customer-reviews.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                Reviews
            </a>
            <a class="nav-item" href="customer-history.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Digital History
            </a>
            <a class="nav-item" href="customer-ai.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                AI Diagnostics
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="header-title">Appointments</h1>
            <div class="header-actions">
                <div class="user-profile">
                    <div class="user-avatar" id="avatarInitial">U</div>
                    <span class="user-name" id="headerName">User</span>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="card-title">
                    <span>Upcoming & Past Appointments</span>
                    <button class="btn-primary" onclick="toggleAppointmentForm()">+ Book Appointment</button>
                </div>
                
                <div id="appointmentFormWrapper" style="display: none; margin-bottom: 24px; padding: 20px; border: 1px dashed var(--border); border-radius: 8px; background: var(--bg);">
                    <h4 style="margin-top: 0;">Book a New Service</h4>
                    <form id="appointmentForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date" id="appointmentDate" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Time</label>
                                <input type="time" id="appointmentTime" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Vehicle</label>
                                <select id="vehId" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label>Service Type</label>
                                <select id="serviceType" class="form-control" required>
                                    <option value="General Service">General Service</option>
                                    <option value="Repair">Repair</option>
                                    <option value="Oil Change">Oil Change</option>
                                    <option value="Inspection">Inspection</option>
                                </select>
                            </div>
                            <div class="form-group full">
                                <label>Issue Description (Optional)</label>
                                <textarea id="issueDescription" class="form-control" rows="2" placeholder="Describe the problem..."></textarea>
                            </div>
                            <div class="form-group full" style="display: flex; gap: 10px;">
                                <button type="submit" class="btn-primary">Confirm Booking</button>
                                <button type="button" class="btn-outline" onclick="toggleAppointmentForm()">Cancel</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div id="appointmentsTableContainer">
                    <p style="text-align:center; padding: 20px;">Loading appointments...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.removeItem('driveSewaUser');
            localStorage.removeItem('driveSewaCustomer');
            window.location.href = '../../public/login.html';
        }
    </script>
    <script src="../../assets/js/customer-appointments.js"></script>
</body>
</html>

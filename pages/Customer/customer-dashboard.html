<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - DriveSewa</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
            border-left-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .section-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards and Forms */
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card-title {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-control {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--surface);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--bg);
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin: 4px 0 0; font-size: 13px; color: var(--secondary);">Customer Portal</p>
        </div>
        <nav>
            <a class="nav-item active" data-tab="dashboard">Dashboard Home</a>
            <a class="nav-item" data-tab="profile">My Profile</a>
            <a class="nav-item" data-tab="vehicles">My Vehicles</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="header-title">Customer Dashboard</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span id="headerName" style="font-weight: 600; color: var(--text-muted);"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="content-area">
            
            <!-- Dashboard Home -->
            <div id="dashboard-section" class="section-panel active">
                <div class="card">
                    <h3 class="card-title">Welcome to DriveSewa!</h3>
                    <p>Manage your profile, vehicles, and appointments directly from this portal.</p>
                </div>
            </div>

            <!-- Profile -->
            <div id="profile-section" class="section-panel">
                <div class="card">
                    <h3 class="card-title">Manage Profile</h3>
                    <form id="profileForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="profEmail" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" id="profPhone" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" id="profAddress" class="form-control" required>
                            </div>
                            <div class="form-group full">
                                <button type="submit" class="btn-primary">Update Profile</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Vehicles -->
            <div id="vehicles-section" class="section-panel">
                <div class="card">
                    <h3 class="card-title">
                        My Vehicles
                        <button class="btn-primary" onclick="toggleVehicleForm()" style="font-size: 13px;">+ Add Vehicle</button>
                    </h3>
                    
                    <div id="vehicleFormWrapper" style="display: none; background: var(--bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);">
                        <h4 style="margin-top: 0;">Add / Edit Vehicle</h4>
                        <form id="vehicleForm">
                            <input type="hidden" id="vehId">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label>Vehicle Number</label>
                                    <input type="text" id="vehNumber" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Brand (Make)</label>
                                    <input type="text" id="vehBrand" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Model</label>
                                    <input type="text" id="vehModel" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Vehicle Type</label>
                                    <select id="vehType" class="form-control" required>
                                        <option value="Car">Car</option>
                                        <option value="Motorcycle">Motorcycle</option>
                                        <option value="SUV">SUV</option>
                                        <option value="Truck">Truck</option>
                                    </select>
                                </div>
                                <div class="form-group full" style="display: flex; gap: 10px;">
                                    <button type="submit" class="btn-primary">Save Vehicle</button>
                                    <button type="button" class="btn-primary" style="background: var(--secondary);" onclick="toggleVehicleForm()">Cancel</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div id="vehiclesTableContainer">
                        <p style="color: var(--secondary); text-align: center; padding: 20px;">Loading vehicles...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const apiBaseUrl = 'http://localhost:5178/api';
        let customerData = null;

        // Init
        window.onload = () => {
            const stored = localStorage.getItem('driveSewaCustomer');
            if(!stored) {
                window.location.href = '../../public/customer-login.html';
                return;
            }
            customerData = JSON.parse(stored);
            if(customerData.role !== 'Customer') {
                logout();
                return;
            }
            document.getElementById('headerName').textContent = customerData.fullName;
            loadProfile();
        };

        function logout() {
            localStorage.removeItem('driveSewaCustomer');
            window.location.href = '../../public/customer-login.html';
        }

        // Navigation
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const tab = e.target.dataset.tab;
                setActiveTab(tab);
            });
        });

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.tab) setActiveTab(e.state.tab, true);
            else setActiveTab('dashboard', true);
        });

        function setActiveTab(tab, preventPush = false) {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.querySelectorAll('.section-panel').forEach(sec => sec.classList.remove('active'));
            
            const activeNav = document.querySelector(`.nav-item[data-tab="${tab}"]`);
            if(activeNav) activeNav.classList.add('active');
            
            const activeSec = document.getElementById(`${tab}-section`);
            if(activeSec) activeSec.classList.add('active');

            if(tab === 'profile') loadProfile();
            if(tab === 'vehicles') loadVehicles();

            if (!preventPush) {
                let targetHtml = 'customer-dashboard.html';
                if(tab === 'profile') targetHtml = 'customer-profile.html';
                if(tab === 'vehicles') targetHtml = 'customer-vehicles.html';
                window.history.pushState({ tab: tab }, '', targetHtml);
            }
        }

        // Profile Logic
        async function loadProfile() {
            try {
                const res = await fetch(`${apiBaseUrl}/customers/${customerData.userId}/profile`);
                if(res.ok) {
                    const prof = await res.json();
                    document.getElementById('profName').value = prof.fullName;
                    document.getElementById('profEmail').value = prof.email;
                    document.getElementById('profPhone').value = prof.phone || '';
                    document.getElementById('profAddress').value = prof.address || '';
                }
            } catch (err) { console.error('Failed to load profile'); }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                fullName: document.getElementById('profName').value.trim(),
                email: document.getElementById('profEmail').value.trim(),
                phone: document.getElementById('profPhone').value.trim(),
                address: document.getElementById('profAddress').value.trim()
            };
            try {
                const res = await fetch(`${apiBaseUrl}/customers/${customerData.userId}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    alert('Profile updated successfully!');
                    customerData.fullName = payload.fullName;
                    localStorage.setItem('driveSewaCustomer', JSON.stringify(customerData));
                    document.getElementById('headerName').textContent = payload.fullName;
                } else {
                    alert('Failed to update profile.');
                }
            } catch(err) { alert('Error updating profile'); }
        });

        // Vehicles Logic
        function toggleVehicleForm() {
            const form = document.getElementById('vehicleFormWrapper');
            if (form.style.display === 'none') {
                form.style.display = 'block';
                document.getElementById('vehicleForm').reset();
                document.getElementById('vehId').value = '';
            } else {
                form.style.display = 'none';
            }
        }

        async function loadVehicles() {
            try {
                const res = await fetch(`${apiBaseUrl}/customers/${customerData.userId}/vehicles`);
                const vehicles = await res.json();
                const container = document.getElementById('vehiclesTableContainer');
                
                if(vehicles.length === 0) {
                    container.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--secondary);">No vehicles found. Add one above.</p>';
                    return;
                }

                container.innerHTML = `
                    <table>
                        <thead>
                            <tr><th>Number</th><th>Brand</th><th>Model</th><th>Type</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            ${vehicles.map(v => `
                                <tr>
                                    <td style="font-weight: 600;">${v.vehicleNumber}</td>
                                    <td>${v.brand}</td>
                                    <td>${v.model}</td>
                                    <td>${v.vehicleType}</td>
                                    <td>
                                        <button class="btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="deleteVehicle(${v.vehicleId})">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                document.getElementById('vehiclesTableContainer').innerHTML = '<p style="color:red;">Error loading vehicles.</p>';
            }
        }

        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customerId: customerData.userId,
                vehicleNumber: document.getElementById('vehNumber').value.trim(),
                brand: document.getElementById('vehBrand').value.trim(),
                model: document.getElementById('vehModel').value.trim(),
                vehicleType: document.getElementById('vehType').value
            };

            try {
                const res = await fetch(`${apiBaseUrl}/customers/vehicles`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    toggleVehicleForm();
                    loadVehicles();
                } else {
                    alert('Failed to save vehicle');
                }
            } catch (err) { alert('Error saving vehicle'); }
        });

        async function deleteVehicle(id) {
            if(!confirm('Are you sure you want to delete this vehicle?')) return;
            try {
                const res = await fetch(`${apiBaseUrl}/customers/vehicles/${id}`, { method: 'DELETE' });
                if(res.ok) loadVehicles();
                else alert('Failed to delete');
            } catch (err) { alert('Error deleting vehicle'); }
        }
    </script>
</body>
</html>

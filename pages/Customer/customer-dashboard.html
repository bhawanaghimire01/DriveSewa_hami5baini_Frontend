<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        button { padding: 10px 15px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #c82333; }
        h1 { color: #343a40; }
        h2 { color: #495057; font-weight: normal; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customer Dashboard</h1>
        <h2 id="welcomeText">Loading...</h2>
        <p>Here you can view available parts, book an appointment, and check your service history.</p>
        <hr style="margin: 20px 0; border: 0; height: 1px; background: #ddd;" />
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        const userStr = localStorage.getItem('driveSewaUser');
        
        if (!userStr) {
            window.location.href = '../../public/login.html'; // basic protection
        } else {
            const user = JSON.parse(userStr);
            if (user.role !== 'Customer') {
                alert('Access Denied. You are not a Customer.');
                window.location.href = '../../public/login.html';
            }
            document.getElementById('welcomeText').textContent = 'Welcome back, ' + user.fullName + '!';
        }
        
        function logout() {
            localStorage.removeItem('driveSewaUser');
            window.location.href = '../../public/login.html';
        }
    </script>
</body>
</html>

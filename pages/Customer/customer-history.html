<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase & Service History - DriveSewa</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card-title {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .history-section {
            display: none;
        }

        .history-section.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            vertical-align: top;
        }

        th {
            background: var(--bg);
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-Pending { background: #fef3c7; color: #d97706; }
        .status-Approved { background: #dcfce7; color: #15803d; }
        .status-Completed { background: #dbeafe; color: #1d4ed8; }

        .empty-state {
            color: var(--secondary);
            text-align: center;
            padding: 24px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin: 4px 0 0; font-size: 13px; color: var(--secondary);">Customer Portal</p>
        </div>
        <nav>
            <a class="nav-item" href="customer-dashboard.html">Dashboard Home</a>
            <a class="nav-item" href="customer-dashboard.html">My Profile</a>
            <a class="nav-item" href="customer-dashboard.html">My Vehicles</a>
            <a class="nav-item" href="customer-appointments.html">Appointments</a>
            <a class="nav-item" href="customer-part-requests.html">Part Requests</a>
            <a class="nav-item" href="customer-reviews.html">Reviews</a>
            <a class="nav-item active" href="customer-history.html">Purchase & Service History</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="header-title">Purchase & Service History</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span id="headerName" style="font-weight: 600; color: var(--text-muted);"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="content-area">
            <div class="card">
                <div class="tabs">
                    <button class="tab-btn active" type="button" data-target="purchase-section">Purchase History</button>
                    <button class="tab-btn" type="button" data-target="service-section">Service History</button>
                </div>

                <section id="purchase-section" class="history-section active">
                    <h3 class="card-title">Purchase History</h3>
                    <div id="purchaseHistoryContainer">
                        <p class="empty-state">Loading purchase history...</p>
                    </div>
                </section>

                <section id="service-section" class="history-section">
                    <h3 class="card-title">Service History</h3>
                    <div id="serviceHistoryContainer">
                        <p class="empty-state">Loading service history...</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="../../assets/Js/customer-history.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('driveSewaCustomer');
            window.location.href = '../../public/login.html';
        }
    </script>
</body>
</html>

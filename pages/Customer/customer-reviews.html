<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - DriveSewa</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #475569;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
        }

        .brand {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .brand h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
            border-left-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* Cards and Forms */
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card-title {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-control {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: var(--surface);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Review Items */
        .review-item {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 16px;
            background: var(--bg);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .rating-stars {
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <h2>DriveSewa</h2>
            <p style="margin: 4px 0 0; font-size: 13px; color: var(--secondary);">Customer Portal</p>
        </div>
        <nav>
            <a class="nav-item" href="customer-dashboard.html">Dashboard Home</a>
            <a class="nav-item" href="customer-dashboard.html">My Profile</a>
            <a class="nav-item" href="customer-dashboard.html">My Vehicles</a>
            <a class="nav-item" href="customer-appointments.html">Appointments</a>
            <a class="nav-item" href="customer-part-requests.html">Part Requests</a>
            <a class="nav-item active" href="customer-reviews.html">Reviews</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 class="header-title">My Reviews</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <span id="headerName" style="font-weight: 600; color: var(--text-muted);"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="content-area">
            <div class="card">
                <h3 class="card-title">
                    Write a Review
                    <button class="btn-primary" onclick="toggleReviewForm()" style="font-size: 13px;">+ Write Review</button>
                </h3>
                
                <div id="reviewFormWrapper" style="display: none; background: var(--bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);">
                    <form id="reviewForm">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label>Rating (1 to 5)</label>
                                <select id="rating" class="form-control" required>
                                    <option value="5">5 - Excellent</option>
                                    <option value="4">4 - Good</option>
                                    <option value="3">3 - Average</option>
                                    <option value="2">2 - Poor</option>
                                    <option value="1">1 - Terrible</option>
                                </select>
                            </div>
                            <div class="form-group full">
                                <label>Comment</label>
                                <textarea id="comment" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="form-group full" style="display: flex; gap: 10px;">
                                <button type="submit" class="btn-primary">Submit Review</button>
                                <button type="button" class="btn-primary" style="background: var(--secondary);" onclick="toggleReviewForm()">Cancel</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div id="reviewsContainer">
                    <p style="color: var(--secondary); text-align: center; padding: 20px;">Loading reviews...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="../../assets/js/customer-reviews.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('driveSewaCustomer');
            window.location.href = '../../public/login.html';
        }
    </script>
</body>
</html>

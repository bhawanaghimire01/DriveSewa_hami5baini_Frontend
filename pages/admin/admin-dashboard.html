    <script>
        const apiBaseUrl = `${window.location.origin}/api`;
        const userStr = localStorage.getItem('driveSewaUser');
        let staffCache = [];
        let editingStaffId = null;
        let activeTab = 'add-staff';

        if (!userStr) {
            window.location.href = '/public/login.html';
        } else {
            const user = JSON.parse(userStr);
            if (user.role !== 'Admin') {
                alert('Access Denied. You are not an Admin.');
                window.location.href = '/public/login.html';
            }
        }

        function setActiveTab(tabName) {
            activeTab = tabName;

            document.querySelectorAll('.sidebar-tab').forEach(button => {
                button.classList.toggle('active', button.dataset.tab === tabName);
            });

            document.getElementById('add-staff-section').classList.toggle('hidden', tabName !== 'add-staff');
            document.getElementById('staff-list-section').classList.toggle('hidden', tabName !== 'staff-list');
            document.getElementById('manage-parts-section').classList.toggle('hidden', tabName !== 'manage-parts');
            document.getElementById('parts-list-section').classList.toggle('hidden', tabName !== 'manage-parts');

            if (tabName === 'staff-list') {
                loadStaff();
            } else if (tabName === 'manage-parts') {
                loadParts();
            }
        }

        function initializeDashboard() {
            document.getElementById('welcomeText').textContent = 'Welcome Admin';

            document.querySelectorAll('.sidebar-tab').forEach(button => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tab));
            });

            setActiveTab('add-staff');
            loadStaff();
            loadParts();
        }

        async function loadStaff() {
            const container = document.getElementById('staffListContainer');
            try {
                const response = await fetch(`${apiBaseUrl}/staff`);
                const staffList = await response.json();

                if (!response.ok) {
                    throw new Error(staffList.message || 'Failed to load staff.');
                }

                staffCache = Array.isArray(staffList) ? staffList : [];
                renderStaffList();
            } catch (err) {
                container.innerHTML = `<div class="empty-state">${err.message}</div>`;
            }
        }

        function renderStaffList() {
            const container = document.getElementById('staffListContainer');

            if (!Array.isArray(staffCache) || staffCache.length === 0) {
                container.innerHTML = '<div class="empty-state">No staff found.</div>';
                return;
            }

            container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Position</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${staffCache.map(staff => renderStaffRow(staff)).join('')}
                        </tbody>
                    </table>`;
        }

        function renderStaffRow(staff) {
            if (editingStaffId !== staff.staffId) {
                return `
                        <tr>
                            <td>${staff.fullName ?? ''}</td>
                            <td>${staff.email ?? ''}</td>
                            <td>${staff.phone ?? ''}</td>
                            <td>${staff.position ?? ''}</td>
                            <td>${staff.role ?? ''}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-secondary" type="button" onclick="startInlineEdit(${staff.staffId})">Edit</button>
                                    <button class="btn-danger" type="button" onclick="deleteStaff(${staff.staffId})">Delete</button>
                                </div>
                            </td>
                        </tr>`;
            }

            return `
                    <tr>
                        <td><input class="row-input" id="edit-fullName-${staff.staffId}" value="${escapeHtml(staff.fullName ?? '')}"></td>
                        <td>${staff.email ?? ''}</td>
                        <td><input class="row-input" id="edit-phone-${staff.staffId}" value="${escapeHtml(staff.phone ?? '')}"></td>
                        <td>
                            <select class="row-input" id="edit-position-${staff.staffId}">
                                <option value="Manager" ${staff.position === 'Manager' ? 'selected' : ''}>Manager</option>
                                <option value="Mechanic" ${staff.position === 'Mechanic' ? 'selected' : ''}>Mechanic</option>
                                <option value="Supervisor" ${staff.position === 'Supervisor' ? 'selected' : ''}>Supervisor</option>
                                <option value="Workshop Supervisor" ${staff.position === 'Workshop Supervisor' ? 'selected' : ''}>Workshop Supervisor</option>
                                <option value="Customer Support" ${staff.position === 'Customer Support' ? 'selected' : ''}>Customer Support</option>
                                <option value="Parts Manager" ${staff.position === 'Parts Manager' ? 'selected' : ''}>Parts Manager</option>
                                <option value="Other" ${staff.position === 'Other' ? 'selected' : ''}>Other</option>
                            </select>
                        </td>
                        <td>${staff.role ?? ''}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-primary" type="button" onclick="saveInlineEdit(${staff.staffId})">Save</button>
                                <button class="btn-secondary" type="button" onclick="cancelInlineEdit()">Cancel</button>
                            </div>
                        </td>
                    </tr>`;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function showMessage(text, isError) {
            const message = document.getElementById('staffMessage');
            message.textContent = text;
            message.className = `message ${isError ? 'error' : 'success'}`;
            message.style.display = 'block';
        }

        function hideMessage() {
            const message = document.getElementById('staffMessage');
            message.style.display = 'none';
            message.textContent = '';
        }

        function resetForm() {
            document.getElementById('staffForm').reset();
            document.getElementById('staffId').value = '';
            document.getElementById('saveButton').textContent = 'Add Staff';
            document.getElementById('cancelButton').style.display = 'none';
            hideMessage();
        }

        function startInlineEdit(staffId) {
            editingStaffId = staffId;
            renderStaffList();
            hideMessage();
        }

        function cancelInlineEdit() {
            editingStaffId = null;
            renderStaffList();
        }

        async function saveInlineEdit(staffId) {
            const staff = staffCache.find(s => s.staffId === staffId);
            if (!staff) {
                showMessage('Staff record was not found.', true);
                return;
            }

            const payload = {
                fullName: document.getElementById(`edit-fullName-${staffId}`).value.trim(),
                email: staff.email,
                password: '',
                phone: document.getElementById(`edit-phone-${staffId}`).value.trim(),
                position: document.getElementById(`edit-position-${staffId}`).value.trim()
            };

            try {
                const response = await fetch(`${apiBaseUrl}/staff/${staffId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Save failed.');
                }

                showMessage('Staff updated successfully.', false);
                editingStaffId = null;
                await loadStaff();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        async function deleteStaff(id) {
            if (!confirm('Delete this staff member?')) {
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/staff/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Delete failed.');
                }

                showMessage(data.message || 'Staff deleted successfully.', false);
                editingStaffId = null;
                resetForm();
                await loadStaff();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        document.getElementById('staffForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const staffId = document.getElementById('staffId').value;
            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value.trim(),
                position: document.getElementById('position').value.trim()
            };

            try {
                const response = await fetch(staffId ? `${apiBaseUrl}/staff/${staffId}` : `${apiBaseUrl}/staff`, {
                    method: staffId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Save failed.');
                }

                showMessage(staffId ? 'Staff updated successfully.' : 'Staff added successfully.', false);
                resetForm();
                await loadStaff();
                setActiveTab('staff-list');
            } catch (err) {
                showMessage(err.message, true);
            }
        });

        // Parts Management Functions
        let partsCache = [];
        let editingPartId = null;

        async function loadParts() {
            const container = document.getElementById('partsListContainer');
            try {
                const response = await fetch(`${apiBaseUrl}/parts`);
                const partsList = await response.json();

                if (!response.ok) {
                    throw new Error(partsList.message || 'Failed to load parts.');
                }

                partsCache = Array.isArray(partsList) ? partsList : [];
                renderPartsList();
            } catch (err) {
                container.innerHTML = `<div class="empty-state">${err.message}</div>`;
            }
        }

        function renderPartsList() {
            const container = document.getElementById('partsListContainer');

            if (!Array.isArray(partsCache) || partsCache.length === 0) {
                container.innerHTML = '<div class="empty-state">No parts found.</div>';
                return;
            }

            container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${partsCache.map(part => renderPartsRow(part)).join('')}
                        </tbody>
                    </table>`;
        }

        function renderPartsRow(part) {
            if (editingPartId !== part.partId) {
                return `
                        <tr>
                            <td>${part.partName ?? ''}</td>
                            <td>Rs. ${parseFloat(part.price ?? 0).toFixed(2)}</td>
                            <td>${part.quantity ?? '0'}</td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-secondary" type="button" onclick="startPartInlineEdit(${part.partId})">Edit</button>
                                    <button class="btn-primary" type="button" onclick="openAddStockModal(${part.partId})">Add Stock</button>
                                    <button class="btn-danger" type="button" onclick="deletePart(${part.partId})">Delete</button>
                                </div>
                            </td>
                        </tr>`;
            }

            return `
                    <tr>
                        <td><input class="row-input" id="edit-partName-${part.partId}" value="${escapeHtml(part.partName ?? '')}"></td>
                        <td><input type="number" class="row-input" id="edit-price-${part.partId}" value="${part.price ?? 0}" step="0.01" min="0"></td>
                        <td><input type="number" class="row-input" id="edit-quantity-${part.partId}" value="${part.quantity ?? 0}" min="0"></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-primary" type="button" onclick="savePartInlineEdit(${part.partId})">Save</button>
                                <button class="btn-secondary" type="button" onclick="cancelPartInlineEdit()">Cancel</button>
                            </div>
                        </td>
                    </tr>`;
        }

        function showPartsMessage(text, isError) {
            const message = document.getElementById('partsMessage');
            message.textContent = text;
            message.className = `message ${isError ? 'error' : 'success'}`;
            message.style.display = 'block';
        }

        function hidePartsMessage() {
            const message = document.getElementById('partsMessage');
            message.style.display = 'none';
            message.textContent = '';
        }

        function resetPartsForm() {
            document.getElementById('partsForm').reset();
            document.getElementById('partId').value = '';
            document.getElementById('savePartButton').textContent = 'Add Part';
            document.getElementById('cancelPartButton').style.display = 'none';
            hidePartsMessage();
        }

        function startPartInlineEdit(partId) {
            editingPartId = partId;
            renderPartsList();
            hidePartsMessage();
        }

        function cancelPartInlineEdit() {
            editingPartId = null;
            renderPartsList();
        }

        async function savePartInlineEdit(partId) {
            const part = partsCache.find(p => p.partId === partId);
            if (!part) {
                showPartsMessage('Part record was not found.', true);
                return;
            }

            const payload = {
                partName: document.getElementById(`edit-partName-${partId}`).value.trim(),
                price: parseFloat(document.getElementById(`edit-price-${partId}`).value) || 0,
                quantity: parseInt(document.getElementById(`edit-quantity-${partId}`).value) || 0
            };

            try {
                const response = await fetch(`${apiBaseUrl}/parts/${partId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Save failed.');
                }

                showPartsMessage('Part updated successfully.', false);
                editingPartId = null;
                await loadParts();
            } catch (err) {
                showPartsMessage(err.message, true);
            }
        }

        async function deletePart(id) {
            if (!confirm('Delete this part?')) {
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/parts/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Delete failed.');
                }

                showPartsMessage(data.message || 'Part deleted successfully.', false);
                editingPartId = null;
                resetPartsForm();
                await loadParts();
            } catch (err) {
                showPartsMessage(err.message, true);
            }
        }

        function openAddStockModal(partId) {
            const part = partsCache.find(p => p.partId === partId);
            if (!part) {
                showPartsMessage('Part not found.', true);
                return;
            }

            const quantity = prompt(`Add Stock for "${part.partName}"\n\nEnter quantity to add:`, '1');
            if (quantity === null || quantity.trim() === '') {
                return;
            }

            const qtyToAdd = parseInt(quantity);
            if (isNaN(qtyToAdd) || qtyToAdd <= 0) {
                showPartsMessage('Please enter a valid quantity.', true);
                return;
            }

            addStock(partId, qtyToAdd);
        }

        async function addStock(partId, quantityToAdd) {
            const part = partsCache.find(p => p.partId === partId);
            if (!part) {
                showPartsMessage('Part not found.', true);
                return;
            }

            const payload = {
                partName: part.partName,
                price: part.price,
                quantity: part.quantity + quantityToAdd
            };

            try {
                const response = await fetch(`${apiBaseUrl}/parts/${partId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Stock update failed.');
                }

                showPartsMessage(`Added ${quantityToAdd} units. Stock updated successfully.`, false);
                await loadParts();
            } catch (err) {
                showPartsMessage(err.message, true);
            }
        }

        document.getElementById('partsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const partId = document.getElementById('partId').value;
            const payload = {
                partName: document.getElementById('partName').value.trim(),
                price: parseFloat(document.getElementById('price').value) || 0,
                quantity: parseInt(document.getElementById('quantity').value) || 0
            };

            try {
                const response = await fetch(partId ? `${apiBaseUrl}/parts/${partId}` : `${apiBaseUrl}/parts`, {
                    method: partId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Save failed.');
                }

                showPartsMessage(partId ? 'Part updated successfully.' : 'Part added successfully.', false);
                resetPartsForm();
                await loadParts();
                setActiveTab('manage-parts');
            } catch (err) {
                showPartsMessage(err.message, true);
            }
        });

        function logout() {
            localStorage.removeItem('driveSewaUser');
            window.location.href = '/public/login.html';
        }

        initializeDashboard();
    </script>
</body>

</html>

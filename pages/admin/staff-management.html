<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - DriveSewa Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --warning: #FFCE20;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

        .sidebar { width: 290px; background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; }
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; }
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 0 40px 40px; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box { background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; border-radius: 30px; width: 350px; font-size: 15px; outline: none; transition: var(--transition); font-family: 'Outfit', sans-serif; color: var(--secondary); }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 15px rgba(67, 24, 255, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67, 24, 255, 0.3); }

        .card { background: var(--surface); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-soft); }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 500; color: var(--secondary); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: var(--primary-light); }

        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge.admin { background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        .badge.staff { background: rgba(1, 181, 116, 0.1); color: var(--success); }

        .btn-action { width: 36px; height: 36px; border-radius: 10px; border: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); margin-right: 8px; }
        .btn-edit { background: rgba(67, 24, 255, 0.08); color: var(--primary); }
        .btn-edit:hover { background: var(--primary); color: white; }
        .btn-delete { background: rgba(238, 93, 80, 0.08); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(17, 4, 122, 0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal { background: var(--surface); width: 450px; border-radius: 24px; padding: 40px; box-shadow: var(--shadow-hover); transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-title { font-size: 24px; font-weight: 700; color: var(--secondary); }
        .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--danger); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--secondary); outline: none; transition: var(--transition); background: var(--bg); font-family: 'Outfit', sans-serif; }
        .form-control:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .btn-cancel { background: var(--bg); color: var(--text); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-cancel:hover { background: var(--border); }
        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-save:hover { background: var(--secondary); }

        @media (max-width: 1024px) { .sidebar { width: 220px; } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-bottom: 1px solid var(--border); }
            .topbar { padding: 20px; flex-direction: column; height: auto; gap: 20px; }
            .content { padding: 20px; }
            .action-bar { flex-direction: column; gap: 20px; align-items: stretch; }
            .search-box { width: 100%; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
            </div>
            <div>
                <div class="brand-title">DriveSewa</div>
                <div class="brand-subtitle">Administration</div>
            </div>
        </div>

        <nav class="side-nav">
            <a href="admin-dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                Dashboard
            </a>
            <a href="staff-management.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Staff Management
            </a>
            <a href="parts-inventory.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Parts Inventory
            </a>
            <a href="purchase-invoice-list.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Purchase Invoices
            </a>
            <a href="vendors.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Vendor Management
            </a>
            <a href="financial-reports.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Financial Reports
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1 class="page-title">Staff Management</h1>
            <div class="top-actions">
                <span class="welcome" id="welcomeText">Admin</span>
                <button class="logout-btn" id="logoutButton">Log Out</button>
            </div>
        </header>

        <section class="content">
            <div class="action-bar">
                <input type="text" id="searchInput" class="search-box" placeholder="Search staff by name or email..." onkeyup="filterTable()">
                <button class="btn-primary" onclick="openModal()">+ Add New Staff</button>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Position</th>
                            <th>Role</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr><td colspan="6" style="text-align:center;">Loading staff data...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="staffModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Staff</h2>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modalError" style="display: none; background: #FFECEB; color: var(--danger); padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 20px;"></div>
            <form id="staffForm" onsubmit="saveStaff(event)">
                <input type="hidden" id="staffId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label>Initial Password</label>
                    <input type="password" id="password" class="form-control" required>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">An email will be sent to the staff with their credentials.</div>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save" id="saveBtn">Save Staff</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5178/api/staff';
        let authToken = '';
        let staffList = [];

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "/public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Admin") { window.location.href = "/public/login.html"; return; }
            
            document.getElementById("welcomeText").textContent = user.fullName || "Admin";
            authToken = user.token || ''; 
            
            document.getElementById("logoutButton").addEventListener("click", () => {
                localStorage.removeItem("driveSewaUser");
                window.location.href = "/public/login.html";
            });
            
            fetchStaff();
        };

        async function fetchStaff() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) {
                    staffList = await res.json();
                    renderTable();
                }
            } catch (e) {
                document.getElementById('staffTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Network Error</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('staffTableBody');
            const term = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = staffList.filter(s => 
                s.fullName.toLowerCase().includes(term) || 
                s.email.toLowerCase().includes(term)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No staff found.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(s => `
                <tr>
                    <td><strong>${s.fullName}</strong></td>
                    <td>${s.email}</td>
                    <td>${s.phone}</td>
                    <td>${s.position}</td>
                    <td><span class="badge ${s.role.toLowerCase()}">${s.role}</span></td>
                    <td style="text-align: right;">
                        <button class="btn-action btn-edit" onclick="openModal(${s.staffId})" title="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                        <button class="btn-action btn-delete" onclick="deleteStaff(${s.staffId})" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() { renderTable(); }

        function openModal(id = null) {
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('staffModal').classList.add('active');
            const form = document.getElementById('staffForm');
            const pwdGroup = document.getElementById('passwordGroup');
            
            if (id) {
                const staff = staffList.find(s => s.staffId === id);
                document.getElementById('modalTitle').textContent = 'Edit Staff';
                document.getElementById('staffId').value = staff.staffId;
                document.getElementById('fullName').value = staff.fullName;
                document.getElementById('email').value = staff.email;
                document.getElementById('email').disabled = true; 
                document.getElementById('phone').value = staff.phone;
                document.getElementById('position').value = staff.position;
                
                document.getElementById('password').required = false;
                pwdGroup.style.display = 'none'; 
            } else {
                form.reset();
                document.getElementById('modalTitle').textContent = 'Add New Staff';
                document.getElementById('staffId').value = '';
                document.getElementById('email').disabled = false;
                document.getElementById('password').required = true;
                pwdGroup.style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('staffModal').classList.remove('active');
            document.getElementById('modalError').style.display = 'none';
        }

        async function saveStaff(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'Saving...'; btn.disabled = true;

            const id = document.getElementById('staffId').value;
            const payload = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                position: document.getElementById('position').value,
                password: document.getElementById('password').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            const errorDiv = document.getElementById('modalError');
            errorDiv.style.display = 'none';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    closeModal();
                    fetchStaff();
                } else {
                    const err = await res.json();
                    errorDiv.textContent = err.message || 'Error saving staff. Please try again with a different email.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) { 
                errorDiv.textContent = 'Network error. Could not connect to the server.';
                errorDiv.style.display = 'block';
            }
            
            btn.innerHTML = 'Save Staff'; btn.disabled = false;
        }

        async function deleteStaff(id) {
            if (!confirm('Are you sure you want to completely delete this staff member?')) return;
            
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (res.ok) fetchStaff();
                else alert('Failed to delete staff');
            } catch (err) { alert('Network error'); }
        }
    </script>
</body>
</html>

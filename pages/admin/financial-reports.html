<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Reports - DriveSewa Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --warning: #FFCE20;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

        .sidebar { width: 290px; background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; }
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; }
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 0 40px 40px; }

        .filters-card { background: var(--surface); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-soft); margin-bottom: 30px; display: flex; align-items: flex-end; gap: 25px; flex-wrap: wrap; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; min-width: 200px; flex: 1; }
        .form-group label { font-size: 14px; font-weight: 600; color: var(--text); }
        .form-control { padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--secondary); outline: none; transition: var(--transition); background: var(--bg); font-family: 'Outfit', sans-serif; }
        .form-control:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 15px rgba(67, 24, 255, 0.2); height: 47px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67, 24, 255, 0.3); }

        .report-section { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .report-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .report-header h2 { font-size: 24px; font-weight: 700; color: var(--secondary); }

        .report-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 30px; }
        
        .metric-card { background: var(--surface); padding: 25px; border-radius: 20px; box-shadow: var(--shadow-soft); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .metric-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 6px 0 0 6px; }
        
        .metric-card h3 { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .metric-card p { font-size: 28px; font-weight: 800; color: var(--secondary); }
        
        .metric-card.revenue::before { background: var(--primary); }
        .metric-card.revenue .icon { color: var(--primary); background: rgba(67, 24, 255, 0.1); }
        
        .metric-card.expense::before { background: var(--danger); }
        .metric-card.expense .icon { color: var(--danger); background: rgba(238, 93, 80, 0.1); }
        .metric-card.expense p { color: var(--danger); }
        
        .metric-card.discount::before { background: var(--warning); }
        .metric-card.discount .icon { color: #E5B200; background: rgba(255, 206, 32, 0.15); }
        
        .metric-card.profit::before { background: var(--success); }
        .metric-card.profit .icon { color: var(--success); background: rgba(1, 181, 116, 0.1); }
        .metric-card.profit p { color: var(--success); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .icon-wrap { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        
        @media (max-width: 1024px) { .sidebar { width: 220px; } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-bottom: 1px solid var(--border); }
            .topbar { padding: 20px; flex-direction: column; height: auto; gap: 20px; }
            .content { padding: 20px; }
            .filters-card { flex-direction: column; align-items: stretch; }
            .btn-primary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
            </div>
            <div>
                <div class="brand-title">DriveSewa</div>
                <div class="brand-subtitle">Administration</div>
            </div>
        </div>

        <nav class="side-nav">
            <a href="admin-dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                Dashboard
            </a>
            <a href="staff-management.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Staff Management
            </a>
            <a href="parts-inventory.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Parts Inventory
            </a>
            <a href="purchase-invoice-list.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Purchase Invoices
            </a>
            <a href="vendors.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Vendor Management
            </a>
            <a href="financial-reports.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Financial Reports
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1 class="page-title">Financial Reports</h1>
            <div class="top-actions">
                <span class="welcome" id="welcomeText">Admin</span>
                <button class="logout-btn" id="logoutButton">Log Out</button>
            </div>
        </header>

        <section class="content">
            
            <div class="filters-card">
                <div class="form-group">
                    <label>Report Frequency</label>
                    <select id="reportType" class="form-control" onchange="toggleInputs()">
                        <option value="daily">Daily Report</option>
                        <option value="monthly">Monthly Report</option>
                        <option value="yearly">Yearly Report</option>
                    </select>
                </div>
                
                <div class="form-group" id="dateInputGrp">
                    <label>Select Date</label>
                    <input type="date" id="dateInput" class="form-control">
                </div>
                
                <div class="form-group" id="monthInputGrp" style="display:none;">
                    <label>Select Month</label>
                    <input type="month" id="monthInput" class="form-control">
                </div>
                
                <div class="form-group" id="yearInputGrp" style="display:none;">
                    <label>Select Year</label>
                    <input type="number" id="yearInput" class="form-control" min="2000" max="2100" value="2026">
                </div>

                <button class="btn-primary" onclick="generateReport()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Generate Report
                </button>
            </div>

            <div id="reportContainer" class="report-section">
                <div class="report-header">
                    <h2>Financial Summary</h2>
                </div>

                <div class="report-cards">
                    
                    <div class="metric-card revenue">
                        <div class="card-top">
                            <h3>Total Sales Revenue</h3>
                            <div class="icon-wrap icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                            </div>
                        </div>
                        <p id="totalRevenue">Rs. 0.00</p>
                    </div>

                    <div class="metric-card expense">
                        <div class="card-top">
                            <h3>Total Purchase Expenses</h3>
                            <div class="icon-wrap icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
                            </div>
                        </div>
                        <p id="totalExpenses">Rs. 0.00</p>
                    </div>

                    <div class="metric-card discount">
                        <div class="card-top">
                            <h3>Total Discounts Given</h3>
                            <div class="icon-wrap icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                            </div>
                        </div>
                        <p id="totalDiscounts">Rs. 0.00</p>
                    </div>

                    <div class="metric-card profit">
                        <div class="card-top">
                            <h3 id="profitTitle">Net Profit</h3>
                            <div class="icon-wrap icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                            </div>
                        </div>
                        <p id="netProfit">Rs. 0.00</p>
                    </div>

                </div>
            </div>

        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:5178/api/reports';
        let authToken = '';

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "/public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Admin") { window.location.href = "/public/login.html"; return; }
            
            document.getElementById("welcomeText").textContent = user.fullName || "Admin";
            authToken = user.token || ''; 
            
            document.getElementById("logoutButton").addEventListener("click", () => {
                localStorage.removeItem("driveSewaUser");
                window.location.href = "/public/login.html";
            });

            // Set default dates
            document.getElementById('dateInput').valueAsDate = new Date();
            const d = new Date();
            document.getElementById('monthInput').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('yearInput').value = d.getFullYear();
        };

        function toggleInputs() {
            const type = document.getElementById('reportType').value;
            document.getElementById('dateInputGrp').style.display = type === 'daily' ? 'flex' : 'none';
            document.getElementById('monthInputGrp').style.display = type === 'monthly' ? 'flex' : 'none';
            document.getElementById('yearInputGrp').style.display = type === 'yearly' ? 'flex' : 'none';
        }

        async function generateReport() {
            const type = document.getElementById('reportType').value;
            let url = '';

            if (type === 'daily') {
                const date = document.getElementById('dateInput').value;
                if (!date) return alert('Select a date');
                url = `${API_URL}/financial/daily?date=${date}`;
            } else if (type === 'monthly') {
                const monthVal = document.getElementById('monthInput').value;
                if (!monthVal) return alert('Select a month');
                const [year, month] = monthVal.split('-');
                url = `${API_URL}/financial/monthly?year=${year}&month=${month}`;
            } else if (type === 'yearly') {
                const year = document.getElementById('yearInput').value;
                if (!year) return alert('Enter a year');
                url = `${API_URL}/financial/yearly?year=${year}`;
            }

            const btn = document.querySelector('.btn-primary');
            const ogHtml = btn.innerHTML;
            btn.innerHTML = 'Generating...';
            btn.disabled = true;

            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    const data = await res.json();

                    document.getElementById('totalRevenue').textContent = `Rs. ${data.totalSalesAmount.toFixed(2)}`;
                    document.getElementById('totalExpenses').textContent = `Rs. ${data.totalPurchaseAmount.toFixed(2)}`;
                    document.getElementById('totalDiscounts').textContent = `Rs. ${data.totalDiscountGiven.toFixed(2)}`;
                    document.getElementById('netProfit').textContent = `Rs. ${Math.abs(data.netProfit).toFixed(2)}`;

                    const profitCard = document.getElementById('netProfit').closest('.metric-card');
                    const profitTitle = document.getElementById('profitTitle');

                    if (data.netProfit >= 0) {
                        profitCard.classList.add('profit');
                        profitCard.classList.remove('expense');
                        profitTitle.textContent = 'Net Profit';
                    } else {
                        profitCard.classList.add('expense');
                        profitCard.classList.remove('profit');
                        profitTitle.textContent = 'Net Deficit';
                    }

                    document.getElementById('reportContainer').style.display = 'block';
                } else {
                    const errorText = await res.text();
                    try {
                        const errorJson = JSON.parse(errorText);
                        alert(`Error fetching report: ${errorJson.message || 'Validation failed.'}`);
                    } catch {
                        alert(`Error fetching report (Status ${res.status}): ${errorText || 'Server error occurred.'}`);
                    }
                }
            } catch (err) {
                alert(`Network error: Check if backend server is running and accessible.`);
            } finally {
                btn.innerHTML = ogHtml;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Management - DriveSewa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F7FE;
            --surface: #FFFFFF;
            --primary: #4318FF;
            --primary-light: #F4F7FE;
            --secondary: #11047A;
            --text: #2B3674;
            --text-muted: #A3AED0;
            --border: #E0E5F2;
            --danger: #EE5D50;
            --success: #01B574;
            --warning: #FFCE20;
            --shadow-soft: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --shadow-hover: 0px 20px 40px rgba(67, 24, 255, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

        .sidebar { width: 290px; background: var(--surface); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.03); box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.04); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .brand-logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #868CFF); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.3); }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); margin-bottom: 8px; }
        .nav-link svg { width: 22px; height: 22px; transition: var(--transition); }
        .nav-link:hover { color: var(--primary); background: rgba(67, 24, 255, 0.04); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.25); }
        .nav-link.active svg { color: white; }

        .main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .topbar { height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(244, 247, 254, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 5; }
        .page-title { font-size: 32px; font-weight: 700; color: var(--secondary); letter-spacing: -0.5px; }
        .top-actions { display: flex; align-items: center; gap: 20px; background: var(--surface); padding: 8px 12px 8px 24px; border-radius: 30px; box-shadow: var(--shadow-soft); }
        .welcome { color: var(--text); font-weight: 600; font-size: 14px; }
        .logout-btn { background: #FFECEB; color: var(--danger); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .logout-btn:hover { background: var(--danger); color: white; }

        .content { padding: 0 40px 40px; }

        .card { background: var(--surface); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-soft); margin-bottom: 30px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .card-title { font-size: 22px; font-weight: 700; color: var(--secondary); }
        
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(67, 24, 255, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67, 24, 255, 0.3); }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 14px; font-weight: 600; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 500; color: var(--secondary); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--primary-light); }

        .action-btns { display: flex; gap: 10px; }
        .btn-edit { background: rgba(67, 24, 255, 0.08); color: var(--primary); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .btn-edit:hover { background: var(--primary); color: white; }
        .btn-delete { background: rgba(238, 93, 80, 0.08); color: var(--danger); border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: var(--transition); }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 4, 122, 0.4); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: var(--surface); width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; box-shadow: var(--shadow-hover); position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .modal-close:hover { color: var(--danger); }
        
        .modal h2 { font-size: 24px; font-weight: 700; color: var(--secondary); margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--secondary); outline: none; transition: var(--transition); background: var(--bg); font-family: 'Outfit', sans-serif; }
        .form-group input:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1); }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px; }
        .btn-secondary { background: var(--bg); color: var(--text); border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); }
        .btn-secondary:hover { background: var(--border); }
        
        .message { padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 500; display: none; }
        .message.error { background: #FFECEB; color: var(--danger); border-left: 4px solid var(--danger); }
        .message.success { background: #E5F8ED; color: var(--success); border-left: 4px solid var(--success); }

        @media (max-width: 1024px) { .sidebar { width: 220px; } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-bottom: 1px solid var(--border); }
            .topbar { padding: 20px; flex-direction: column; height: auto; gap: 20px; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path><path d="M2 12h20"></path></svg>
            </div>
            <div>
                <div class="brand-title">DriveSewa</div>
                <div class="brand-subtitle">Administration</div>
            </div>
        </div>

        <nav class="side-nav">
            <a href="admin-dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                Dashboard
            </a>
            <a href="staff-management.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Staff Management
            </a>
            <a href="parts-inventory.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Parts Inventory
            </a>
            <a href="purchase-invoice-list.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Purchase Invoices
            </a>
            <a href="vendors.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Vendor Management
            </a>
            <a href="financial-reports.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Financial Reports
            </a>
        </nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1 class="page-title">Vendor Management</h1>
            <div class="top-actions">
                <span class="welcome" id="welcomeText">Admin</span>
                <button class="logout-btn" id="logoutButton">Log Out</button>
            </div>
        </header>

        <section class="content">
            <div id="alertMsg" class="message"></div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">All Vendors</h2>
                    <button class="btn-primary" onclick="openModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add Vendor
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Company Name</th>
                            <th>Contact Person</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="vendorTableBody">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading vendors...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Vendor Modal -->
    <div id="vendorModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 id="modalTitle">Add Vendor</h2>
            <form id="vendorForm">
                <input type="hidden" id="vendorId">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="vendorName" required placeholder="Enter company name">
                </div>
                <div class="form-group">
                    <label>Contact Person</label>
                    <input type="text" id="contactPerson" required placeholder="Enter contact person">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" required placeholder="Enter phone number">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="Enter email address">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" required placeholder="Enter full address">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveBtn">Save Vendor</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5178/api/vendors';
        let authToken = '';

        window.onload = () => {
            const userData = localStorage.getItem("driveSewaUser");
            if (!userData) { window.location.href = "/public/login.html"; return; }
            const user = JSON.parse(userData);
            if (!user || user.role !== "Admin") { window.location.href = "/public/login.html"; return; }
            
            document.getElementById("welcomeText").textContent = user.fullName || "Admin";
            authToken = user.token || ''; 
            
            document.getElementById("logoutButton").addEventListener("click", () => {
                localStorage.removeItem("driveSewaUser");
                window.location.href = "/public/login.html";
            });

            loadVendors();
        };

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            };
        }

        function showMessage(msg, type) {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.textContent = msg;
            alertMsg.className = 'message ' + type;
            alertMsg.style.display = 'block';
            setTimeout(() => { alertMsg.style.display = 'none'; }, 4000);
        }

        async function loadVendors() {
            try {
                const res = await fetch(API_URL, { headers: getAuthHeaders() });
                if (!res.ok) throw new Error('Failed to load vendors');
                const vendors = await res.json();
                renderTable(vendors);
            } catch (error) {
                document.getElementById('vendorTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);">Error loading vendors. Is the backend running?</td></tr>`;
            }
        }

        function renderTable(vendors) {
            const tbody = document.getElementById('vendorTableBody');
            if(vendors.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No vendors found. Add a new one.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = vendors.map(v => `
                <tr>
                    <td><strong>${v.vendorName}</strong></td>
                    <td>${v.contactPerson}</td>
                    <td>${v.phone}</td>
                    <td>${v.email}</td>
                    <td>${v.address}</td>
                    <td class="action-btns">
                        <button class="btn-edit" onclick='openModal(${JSON.stringify(v)})'>Edit</button>
                        <button class="btn-delete" onclick="deleteVendor(${v.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        const modal = document.getElementById('vendorModal');
        const form = document.getElementById('vendorForm');

        function openModal(vendor = null) {
            form.reset();
            if(vendor) {
                document.getElementById('modalTitle').textContent = 'Edit Vendor';
                document.getElementById('vendorId').value = vendor.id;
                document.getElementById('vendorName').value = vendor.vendorName;
                document.getElementById('contactPerson').value = vendor.contactPerson;
                document.getElementById('phone').value = vendor.phone;
                document.getElementById('email').value = vendor.email;
                document.getElementById('address').value = vendor.address;
            } else {
                document.getElementById('modalTitle').textContent = 'Add Vendor';
                document.getElementById('vendorId').value = '';
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('vendorId').value;
            const payload = {
                vendorName: document.getElementById('vendorName').value,
                contactPerson: document.getElementById('contactPerson').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value
            };

            const url = id ? `${API_URL}/${id}` : API_URL;
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showMessage(`Vendor ${id ? 'updated' : 'added'} successfully!`, 'success');
                    closeModal();
                    loadVendors();
                } else {
                    const err = await res.text();
                    showMessage('Error: ' + err, 'error');
                }
            } catch(e) {
                showMessage('Network error. Check if backend is running.', 'error');
            }
        });

        async function deleteVendor(id) {
            if(!confirm('Are you sure you want to delete this vendor?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if(res.ok) {
                    showMessage('Vendor deleted successfully!', 'success');
                    loadVendors();
                } else {
                    const err = await res.text();
                    showMessage('Error: ' + err, 'error');
                }
            } catch(e) {
                showMessage('Network error.', 'error');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DriveSewa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            overflow: hidden;
        }

        /* Abstract Background Shapes */
        .shape-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(0,0,0,0) 70%); top: -200px; left: -200px; border-radius: 50%; z-index: 0; }
        .shape-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, rgba(0,0,0,0) 70%); bottom: -100px; right: -100px; border-radius: 50%; z-index: 0; }

        .auth-container {
            width: 100%;
            display: flex;
            z-index: 1;
        }

        .auth-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-left h1 { font-size: 3.5rem; font-weight: 800; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .auth-left p { font-size: 1.2rem; color: #94a3b8; line-height: 1.6; max-width: 480px; }

        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .login-card h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
        .login-card p { color: #94a3b8; margin-bottom: 32px; font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .form-control:focus { outline: none; border-color: #3b82f6; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #3b82f6, #6366f1);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }

        .auth-links { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 0.95rem; }
        .auth-links a { color: #60a5fa; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .auth-links a:hover { color: #93c5fd; text-decoration: underline; }

        .error-msg { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem; display: none; }

        @media (max-width: 900px) {
            .auth-container { flex-direction: column; }
            .auth-left { padding: 40px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex: none; }
            .auth-left h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="shape-1"></div>
    <div class="shape-2"></div>

    <div class="auth-container">
        <div class="auth-left">
            <h1>DriveSewa.</h1>
            <p>Your premium vehicle parts and service management system. Experience next-generation automotive care and unparalleled efficiency.</p>
        </div>
        <div class="auth-right">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p>Enter your credentials to access your account.</p>
                
                <div id="errorMessage" class="error-msg"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
                </form>
                
                <div class="auth-links">
                    <p>New to DriveSewa? <a href="/public/register.html">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Ensure standard URL mapping
        const API_BASE_URL = window.location.origin.includes('5178') ? window.location.origin + '/api' : 'http://localhost:5178/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            btn.textContent = 'Signing In...';
            btn.style.opacity = '0.7';
            errorDiv.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Invalid credentials. Please try again.');
                }
                
                localStorage.setItem('driveSewaUser', JSON.stringify(data));
                if (data.role && data.role.toLowerCase() === 'customer') {
                    localStorage.setItem('driveSewaCustomer', JSON.stringify(data));
                }
                
                if (data.role && data.role.toLowerCase() === 'admin') {
                    window.location.href = '../pages/admin/admin-dashboard.html';
                } else if (data.role && data.role.toLowerCase() === 'staff') {
                    window.location.href = '../pages/Staff/staff-dashboard.html';
                } else {
                    window.location.href = '../pages/Customer/customer-dashboard.html';
                }
                
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                btn.textContent = 'Sign In';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>

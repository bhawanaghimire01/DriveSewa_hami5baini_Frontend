<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DriveSewa</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Abstract Background Shapes */
        .shape-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(0,0,0,0) 70%); top: -200px; left: -200px; border-radius: 50%; z-index: 0; }
        .shape-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, rgba(0,0,0,0) 70%); bottom: -100px; right: -100px; border-radius: 50%; z-index: 0; }

        .auth-container {
            width: 100%;
            display: flex;
            z-index: 1;
        }

        .auth-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .auth-left h1 { font-size: 3.5rem; font-weight: 800; background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .auth-left p { font-size: 1.2rem; color: #94a3b8; line-height: 1.6; max-width: 480px; }

        .auth-right {
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            margin: auto;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .login-card h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
        .login-card p { color: #94a3b8; margin-bottom: 32px; font-size: 0.95rem; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: 1 / -1; margin-bottom: 16px; }

        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .form-control:focus { outline: none; border-color: #3b82f6; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3);
            grid-column: 1 / -1;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        .auth-links { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 0.95rem; grid-column: 1 / -1; }
        .auth-links a { color: #60a5fa; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .auth-links a:hover { color: #93c5fd; text-decoration: underline; }

        .error-msg { background: rgba(239, 68, 68, 0.1); border-left: 4px solid #ef4444; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem; display: none; }
        .success-msg { background: rgba(16, 185, 129, 0.1); border-left: 4px solid #10b981; color: #86efac; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem; display: none; }

        @media (max-width: 900px) {
            .auth-container { flex-direction: column; }
            .auth-left { padding: 40px; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex: none; height: auto; position: relative; }
            .auth-left h1 { font-size: 2.5rem; }
            .form-grid { grid-template-columns: 1fr; }
            .login-card { padding: 32px; margin: 20px 0; }
        }
    </style>
</head>
<body>

    <div class="shape-1"></div>
    <div class="shape-2"></div>

    <div class="auth-container">
        <div class="auth-left">
            <h1>DriveSewa.</h1>
            <p>Join the future of automotive care. Create an account to easily book appointments, track your vehicle's history, and access AI-driven diagnostics.</p>
        </div>
        <div class="auth-right">
            <div class="login-card">
                <h2>Create Account</h2>
                <p>Register as a new customer below.</p>
                
                <div id="errorMessage" class="error-msg"></div>
                <div id="successMessage" class="success-msg"></div>
                
                <form id="registerForm" class="form-grid">
                    <div class="form-group full">
                        <label>Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="John Doe" required />
                    </div>
                    
                    <div class="form-group full">
                        <label>Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
                    </div>

                    <div class="form-group full">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
                    </div>
                    
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+977 98..." required />
                    </div>
                    
                    <div class="form-group">
                        <label>Physical Address</label>
                        <input type="text" id="address" class="form-control" placeholder="City, Street" required />
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Sign Up Now</button>
                    
                    <div class="auth-links">
                        <p>Already have an account? <a href="/public/login.html">Sign in here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin.includes('5178') ? window.location.origin + '/api' : 'http://localhost:5178/api';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            btn.textContent = 'Creating Account...';
            btn.style.opacity = '0.7';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/Auth/register-customer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed. Please check your data.');
                }
                
                successDiv.textContent = 'Registration successful! Redirecting to login...';
                successDiv.style.display = 'block';
                
                document.getElementById('registerForm').reset();
                
                setTimeout(() => {
                    window.location.href = '/public/login.html';
                }, 2000);
                
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                btn.textContent = 'Sign Up Now';
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
